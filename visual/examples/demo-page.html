<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo results page</title>
<style>
  body{margin:0;font:15px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#f6f7f9;color:#1d2127}
  header{padding:16px 16px 8px;font-weight:700;font-size:20px}
  .chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;white-space:nowrap}
  .chip{flex:0 0 auto;border:1px solid #c9ced6;border-radius:999px;padding:7px 14px;background:#fff;font-size:14px}
  .card{margin:12px 16px;padding:14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .card b{display:block;margin-bottom:4px}
</style></head>
<body>
  <header>Results</header>
  <div class="chips">
    <span class="chip">Sort: Best</span><span class="chip">Price</span><span class="chip">Rating 4+</span>
    <span class="chip">Open now</span><span class="chip">Distance</span>
  </div>
  <div class="card"><b>Example item one</b>Placeholder description text.</div>
  <div class="card"><b>Example item two</b>Placeholder description text.</div>
</body></html>
